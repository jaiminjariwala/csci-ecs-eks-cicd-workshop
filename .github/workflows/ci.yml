name: Application CI
on:
  push:
    branches: [main, 'enhancement/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests and health failure test
        run: python3 -m unittest discover -s tests -v
      - name: Validate Python syntax
        run: python3 -m compileall -q app tests scripts
